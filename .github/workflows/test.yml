name: test
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: optilint
        uses: ./
        with:
          working-directory: test/fixture
          fail-on: never
      - name: The fixture's two findings were reported
        env:
          FINDINGS: ${{ steps.optilint.outputs.findings }}
        run: test "$FINDINGS" = 2

  fails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: optilint
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixture
      - name: fail-on findings failed the step
        env:
          OUTCOME: ${{ steps.optilint.outcome }}
        run: test "$OUTCOME" = failure
